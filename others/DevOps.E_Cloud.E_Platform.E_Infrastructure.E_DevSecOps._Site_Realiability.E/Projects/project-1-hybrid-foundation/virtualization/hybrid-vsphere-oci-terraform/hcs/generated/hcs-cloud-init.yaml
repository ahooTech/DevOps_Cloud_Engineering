#cloud-config
# Production-grade cloud-init for Huawei Cloud ECS

# 1. System Updates & Packages
package_update: true
package_upgrade: false
packages:
  - qemu-guest-agent
  - auditd
  - fail2ban
  - ufw
  - curl
  - jq

# 2. Secure File Creation (Idempotent & Restricted Permissions)
write_files:
  - path: /etc/hcs/bridge-sync.conf
    owner: root:root
    permissions: '0600'
    content: |
      BRIDGE_TARGET_IP=10.20.1.238
      BRIDGE_PORT=8443
      SYNC_PROTOCOL=tls
      CERT_PATH=/etc/hcs/certs/bridge.crt
      KEY_PATH=/etc/hcs/certs/bridge.key

  - path: /etc/sysctl.d/99-hcs-hardening.conf
    owner: root:root
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 0
      net.ipv4.conf.all.accept_redirects = 0
      kernel.kptr_restrict = 2

# 3. Boot Commands (Firewall, Services, Hardening)
runcmd:
  # Enable Huawei Cloud guest agent
  - systemctl enable --now qemu-guest-agent
  
  # Enable auditd and fail2ban
  - systemctl enable --now auditd
  - systemctl enable --now fail2ban
  
  # Configure and enable UFW (Uncomplicated Firewall)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 8443/tcp comment 'HCS Bridge Sync'
  - ufw --force enable
  
  # Apply kernel hardening
  - sysctl -p /etc/sysctl.d/99-hcs-hardening.conf
  
  # SSH Hardening (Disable root login and password auth)
  - sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart sshd

# 4. Final Output
final_message: "✅ HCS ECS production boot complete. Sync target: 10.20.1.238"